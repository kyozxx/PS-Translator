<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra Account ID</title><style>
:root{--bg:#f4f5f8;--card:#fff;--fg:#14161c;--mute:#667;--acc:#2f6bff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#191c24;--fg:#eef0f5;--mute:#99a;--acc:#5b8cff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:40px 16px}
main{background:var(--card);border-radius:16px;padding:24px;max-width:440px;width:100%;box-sizing:border-box}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px}
form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #8884;background:transparent;color:inherit;font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}
.row{margin-top:16px}.row b{display:block;font-size:13px;color:var(--mute)}.row code{display:block;word-break:break-all;font-size:18px;margin:4px 0}
.copy{padding:6px 10px;font-size:14px}.help{margin-top:20px;color:var(--mute)}.help summary{cursor:pointer}.help img{display:block;width:100%;border-radius:12px;margin-top:12px}#msg{margin-top:16px}
</style></head><body><main>
<h1>Tra Account ID</h1><p>Nhập Online ID (tên người chơi) để lấy mã dán vào app.</p>
<form id="f"><input id="id" placeholder="Online ID" autocomplete="off" autocapitalize="off" spellcheck="false" required><button>Tra</button></form>
<div id="msg"></div><div id="out" hidden>
<div class="row"><b>Mã dán vào app</b><code id="b64"></code><button class="copy" data-c="b64">Sao chép</button></div></div>
<details class="help"><summary>Cách xem Online ID trên máy</summary>
<img src="https://ps5tiengviet.com/screenshots/app/07-find-online-id.jpg" alt="Ảnh đại diện, Hồ sơ, Online ID dưới tên hiển thị" loading="lazy"></details>
</main><script>
const $=(i)=>document.getElementById(i);
const say={invalid:'Online ID không hợp lệ.',missing:'Không tìm thấy người chơi này.',busy:'Máy chủ đang bận, thử lại sau ít phút.'};
$('f').onsubmit=async(e)=>{e.preventDefault();$('out').hidden=true;$('msg').textContent='Đang tra...';
 try{const r=await fetch('https://id.kyozx.cloud/lookup?id='+encodeURIComponent($('id').value.trim()));const j=await r.json();
  if(j.error){$('msg').textContent=say[j.error]||say.busy;return}
  $('msg').textContent='Người chơi: '+j.onlineId;$('b64').textContent=j.base64;$('out').hidden=false}
 catch{$('msg').textContent=say.busy}};
document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText($(b.dataset.c).textContent);b.textContent='Đã chép';setTimeout(()=>b.textContent='Sao chép',1500)});
</script></body></html>
