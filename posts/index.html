<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Posts</title>
<!--
  Telegram post image: headline on top, one iPhone screenshot below, the new control lit up. 1080x1350.
  index.html          : every post, small
  index.html?post=ID  : one post full size, for export
  New post: add one entry to POSTS. phone = file in ../appstore/raw; hl = the new control on the
  screenshot as [left, top, width, height] in % of the screenshot; tag = the label beside it.
-->
<style>
  :root { --amber: #f2a516; --gold: #ffd27a; --cream: #fff8e6; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: #f2f2f7; }
  .card { width: 1080px; height: 1350px; position: relative; overflow: hidden; color: var(--cream); text-align: center; background: #0b0906; }
  /* warm stage light behind the phone, a soft floor glow */
  .card::before { content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(60% 40% at 50% 62%, #f2a51633 0%, transparent 70%),
      radial-gradient(90% 55% at 50% -5%, #5a3c10 0%, transparent 70%),
      linear-gradient(180deg, #1a130a 0%, #0b0906 60%); }
  .card::after { content: ""; position: absolute; left: -10%; right: -10%; top: 300px; height: 900px; opacity: .5;
    background: conic-gradient(from 200deg at 50% 0%, transparent 0 20deg, #f2a51618 30deg, transparent 45deg, transparent 315deg, #f2a51618 330deg, transparent 340deg); }
  .cap { position: absolute; top: 70px; left: 50px; right: 50px; z-index: 2; }
  .eyebrow { display: inline-block; font-size: 30px; font-weight: 800; letter-spacing: .14em; color: #1b1a17;
    background: linear-gradient(90deg, var(--gold), var(--amber)); padding: 10px 28px; border-radius: 999px; margin-bottom: 28px; box-shadow: 0 10px 30px -8px #f2a516aa; }
  h1 { font-size: 96px; line-height: 1.02; font-weight: 900; letter-spacing: -.04em; text-shadow: 0 6px 40px #0008; }
  h1 em { font-style: normal; color: var(--amber); }
  .cap p { font-size: 36px; line-height: 1.35; margin-top: 22px; color: #e9dfc8; font-weight: 500; }
  .stage { position: absolute; left: 50%; top: 440px; width: 400px; transform: translateX(-50%) perspective(2200px) rotateY(-10deg) rotateX(3deg) rotateZ(2deg); z-index: 1; }
  .phone { position: relative; border-radius: 82px; padding: 15px; background: linear-gradient(135deg, #3b3b3e, #0d0d0e 40%, #2a2a2c);
    box-shadow: inset 0 0 0 3px #1a1a1b, -30px 60px 120px -20px #000, 0 0 120px -20px #f2a51655; }
  .phone img { display: block; width: 100%; border-radius: 68px; }
  .phone::after { content: ""; position: absolute; top: 2.65%; left: 50%; transform: translateX(-50%); width: 31%; height: 4%; background: #000; border-radius: 999px; }
  .hl { position: absolute; border-radius: 22px; box-shadow: 0 0 0 5px var(--amber), 0 0 50px 10px #f2a516cc, 0 0 0 2000px #0007; }
  .tag { position: absolute; z-index: 3; font-size: 34px; font-weight: 900; color: #1b1a17; letter-spacing: .06em;
    background: linear-gradient(90deg, var(--gold), var(--amber)); padding: 12px 26px; border-radius: 16px; box-shadow: 0 16px 40px -10px #000; transform: rotate(-4deg); }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); border: 16px solid transparent; border-top-color: var(--amber); border-bottom: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .grid .wrap { width: 378px; height: 473px; overflow: hidden; border-radius: 18px; }
  .grid .card { transform: scale(.35); transform-origin: top left; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const POSTS = [
  { id: '1.3.2', eyebrow: 'MỚI TRONG 1.3.2', title: 'Phụ đề lên TV<br><em>chỉ một chạm</em>',
    text: 'Bấm TV LG: app tự mở phụ đề trên TV và vào dịch luôn.',
    phone: 'connect.png', hl: [76, 79.6, 19.6, 6.6], tag: 'MỚI' },
];
const card = p => {
  const [x, y, w, h] = p.hl || [];
  return `<section class="card"><div class="cap"><span class="eyebrow">${p.eyebrow}</span><h1>${p.title}</h1><p>${p.text}</p></div>
  <div class="stage"><div class="phone"><img src="../appstore/raw/${p.phone}" alt="">
  ${p.hl ? `<div style="position:absolute;inset:15px;border-radius:68px;overflow:hidden"><div class="hl" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div></div>
  <div class="tag" style="left:calc(15px + ${x + w / 2}% - 60px);top:calc(15px + ${y}% - 90px)">${p.tag}</div>` : ''}
  </div></div></section>`;
};
const id = new URLSearchParams(location.search).get('post');
const root = document.getElementById('root');
if (id) { document.body.style.background = '#000'; root.innerHTML = card(POSTS.find(p => p.id === id)); }
else { root.className = 'grid'; root.innerHTML = POSTS.map(p => `<div class="wrap">${card(p)}</div>`).join(''); }
</script>
</body>
</html>
