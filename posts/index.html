<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Posts</title>
<!--
  Telegram post image: headline on top, one iPhone screenshot below, the new control lit up. 1080x1080.
  index.html          : every post, small
  index.html?post=ID  : one post full size, for export
  New post: add one entry to POSTS. phone = file in ../appstore/raw; hl = the new control on the
  screenshot as [left, top, width, height] in % of the screenshot; tag = the label beside it.
  theme: 'gold' (owner's choice 2026-10-30 for every new post) = black-gold background plus logo, name and slogan.
-->
<style>
  :root { --amber: #f2a516; --gold: #ffd27a; --cream: #fff8e6; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: #f2f2f7; }
  .card { width: 1080px; height: 1080px; position: relative; overflow: hidden; color: #fff; text-align: center;
    background: linear-gradient(140deg, #ffb340 0%, #ff6a3d 38%, #ff3d7f 68%, #7a4dff 100%); }
  .card::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(55% 45% at 50% 78%, #ffffff40 0%, transparent 70%), radial-gradient(40% 30% at 12% 8%, #ffffff35 0%, transparent 70%); }
  .card::after { content: ""; position: absolute; width: 900px; height: 900px; right: -420px; bottom: -480px; border-radius: 50%; border: 60px solid #ffffff18; }
  .cap { position: absolute; top: 54px; left: 50px; right: 50px; z-index: 2; }
  .eyebrow { display: inline-block; font-size: 26px; font-weight: 800; letter-spacing: .14em; color: #ff3d7f;
    background: #fff; padding: 9px 26px; border-radius: 999px; margin-bottom: 22px; box-shadow: 0 10px 30px -10px #0005; }
  h1 { font-size: 84px; line-height: 1.02; font-weight: 900; letter-spacing: -.04em; text-shadow: 0 6px 30px #0003; }
  h1 em { font-style: normal; color: #fff36b; }
  .cap p { font-size: 32px; line-height: 1.3; margin-top: 16px; color: #fff; font-weight: 600; opacity: .95; }
  .stage { position: absolute; left: 50%; top: 360px; width: 330px; transform: translateX(-50%) perspective(2200px) rotateY(-10deg) rotateX(3deg) rotateZ(3deg); z-index: 1; }
  .phone { position: relative; border-radius: 68px; padding: 12px; background: linear-gradient(135deg, #4a4a4e, #111 40%, #333);
    box-shadow: inset 0 0 0 3px #1a1a1b, -24px 50px 90px -20px #3a0a3a99; }
  .phone img { display: block; width: 100%; border-radius: 57px; }
  .phone::after { content: ""; position: absolute; top: 2.65%; left: 50%; transform: translateX(-50%); width: 31%; height: 4%; background: #000; border-radius: 999px; }
  .hl { position: absolute; border-radius: 18px; box-shadow: 0 0 0 5px #fff36b, 0 0 40px 10px #fff36bcc, 0 0 0 2000px #0006; }
  .tag { position: absolute; z-index: 3; font-size: 30px; font-weight: 900; color: #ff3d7f; letter-spacing: .06em;
    background: #fff36b; padding: 10px 22px; border-radius: 14px; box-shadow: 0 14px 30px -10px #0006; transform: rotate(-4deg); }
  .tag::after { content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); border: 14px solid transparent; border-top-color: #fff36b; border-bottom: 0; }
  .card.duo .stage:not(.back) { left: 62%; width: 330px; }
  .stage.back { left: 31%; width: 280px; top: 410px; transform: translateX(-50%) perspective(2200px) rotateY(12deg) rotateX(3deg) rotateZ(-4deg); z-index: 0; opacity: .95; }
  .tag.small { font-size: 24px; padding: 8px 16px; white-space: nowrap; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 26px; text-align: left; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 26px -6px #0008, 0 0 0 2px #ffffff30; }
  .brand b { display: block; font-size: 38px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { display: block; font-size: 26px; font-weight: 600; opacity: .9; }
  .card.branded .cap { top: 40px; }
  .card.branded .stage { top: 450px; }
  .card.branded .stage.back { top: 500px; }
  .card.branded h1 { font-size: 92px; }
  .card.gold { background: radial-gradient(70% 55% at 50% 72%, #6b3d0a 0%, #2a1606 45%, #0c0805 100%); }
  .card.gold::before { background: radial-gradient(40% 30% at 50% 0%, #ffcf6b55 0%, transparent 70%), conic-gradient(from 200deg at 50% -10%, transparent 0deg, #ffd27a14 10deg, transparent 20deg, #ffd27a10 32deg, transparent 44deg, #ffd27a14 56deg, transparent 70deg); }
  .card.gold::after { border-color: #ffd27a14; }
  .card.gold h1 em, .card.gold .brand span { color: var(--gold); }
  .card.gold .eyebrow { color: #2a1606; background: linear-gradient(90deg, #ffd27a, #f2a516); }
  .card.gold .hl { box-shadow: 0 0 0 5px var(--gold), 0 0 40px 10px #ffd27acc, 0 0 0 2000px #0007; }
  .card.gold .tag { background: var(--gold); color: #2a1606; }
  .card.gold .tag::after { border-top-color: var(--gold); }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .grid .wrap { width: 378px; height: 378px; overflow: hidden; border-radius: 18px; }
  .grid .card { transform: scale(.35); transform-origin: top left; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const POSTS = [
  { id: '1.3.2', eyebrow: 'MỚI TRONG 1.3.2', title: 'Phụ đề lên TV<br><em>chỉ một chạm</em>',
    text: 'Bấm TV LG: app tự mở phụ đề trên TV và vào dịch luôn.',
    phone: 'connect.png', hl: [76, 79.6, 19.6, 6.6], tag: 'MỚI' },
  { id: 'lg-iphone', eyebrow: 'TÍNH NĂNG MỚI', title: 'Cài app TV LG<br><em>ngay trên iPhone</em>',
    text: 'Không cần máy tính: chọn TV LG, nhập IP, Passphrase, bấm Cài.',
    phone: 'lg-install-real.png', hl: [9.5, 77.8, 31.6, 4.4], tag: 'MỚI',
    back: 'tv-pick-lg.png', backHl: [36.5, 47.8, 26.5, 12.4], backTag: 'Chọn TV LG' },
  { id: 'viet-hoa-26', eyebrow: 'TỔNG HỢP CẬP NHẬT', title: 'Việt hóa<br><em>26 game</em>',
    text: 'Wolverine, Spider-Man, The Last of Us, Stellar Blade... dịch chuẩn như bản cộng đồng.',
    phone: 'menu.png', hl: [7.5, 24.8, 87, 13.8], tag: 'MỚI',
    back: 'home.png', backHl: [7, 30, 86, 5.6], backTag: 'Bắt đầu dịch', theme: 'gold' },
];
const card = p => {
  const [x, y, w, h] = p.hl || [];
  const back = p.back ? (() => { const [a, b, c, d] = p.backHl;
    return `<div class="stage back"><div class="phone"><img src="../appstore/raw/${p.back}" alt="">
    <div style="position:absolute;inset:12px;border-radius:57px;overflow:hidden"><div class="hl" style="left:${a}%;top:${b}%;width:${c}%;height:${d}%"></div></div>
    <div class="tag small" style="left:calc(12px + ${a + c / 2}% - 90px);top:calc(12px + ${b}% - 62px)">${p.backTag}</div></div></div>`; })() : '';
  return `<section class="card${p.back ? ' duo' : ''}${p.theme ? ' branded ' + p.theme : ''}">${back}<div class="cap">${p.theme ? '<div class="brand"><img src="app-icon.png" alt=""><div><b>Console Translator</b><span>Chơi game nào cũng hiểu</span></div></div>' : ''}<span class="eyebrow">${p.eyebrow}</span><h1>${p.title}</h1><p>${p.text}</p></div>
  <div class="stage"><div class="phone"><img src="../appstore/raw/${p.phone}" alt="">
  ${p.hl ? `<div style="position:absolute;inset:12px;border-radius:57px;overflow:hidden"><div class="hl" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div></div>
  <div class="tag" style="left:calc(12px + ${x + w / 2}% - 52px);top:calc(12px + ${y}% - 76px)">${p.tag}</div>` : ''}
  </div></div></section>`;
};
const id = new URLSearchParams(location.search).get('post');
const root = document.getElementById('root');
if (id) { document.body.style.background = '#000'; root.innerHTML = card(POSTS.find(p => p.id === id)); }
else { root.className = 'grid'; root.innerHTML = POSTS.map(p => `<div class="wrap">${card(p)}</div>`).join(''); }
</script>
</body>
</html>
