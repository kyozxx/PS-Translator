<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram Posts</title>
<!--
  Telegram post image: a title on top, one iPhone screenshot below. 1080x1350.
  index.html          : every post, small
  index.html?post=ID  : one post full size, for export
  New post: add one entry to POSTS (phone = a file in ../appstore/raw).
-->
<style>
  :root { --amber: #f2a516; --cream: #fff8e6; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: #f2f2f7; }
  .card { width: 1080px; height: 1350px; position: relative; overflow: hidden; color: var(--cream); text-align: center;
    background: radial-gradient(110% 70% at 50% 0%, #3a2a10 0%, #14110c 55%, #0b0a08 100%); }
  .cap { position: absolute; top: 64px; left: 60px; right: 60px; }
  h1 { font-size: 84px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: var(--amber); }
  .cap p { font-size: 38px; line-height: 1.35; margin-top: 22px; color: #e9dfc8; font-weight: 500; }
  .phone { position: absolute; left: 50%; transform: translateX(-50%); top: 300px; width: 470px; border-radius: 74px; padding: 14px; background: #050505;
    box-shadow: 0 0 0 5px #3a3a3c, 0 0 0 10px #1c1c1e, 0 60px 120px -30px #000; }
  .phone img { display: block; width: 100%; border-radius: 61px; }
  .phone::after { content: ""; position: absolute; top: 2.65%; left: 50%; transform: translateX(-50%); width: 31%; height: 4%; background: #000; border-radius: 999px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .grid .wrap { width: 378px; height: 473px; overflow: hidden; border-radius: 18px; }
  .grid .card { transform: scale(.35); transform-origin: top left; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const POSTS = [
  { id: '1.3.2', title: 'Mở TV LG <em>một chạm</em>', text: 'Bấm nút TV LG: app mở phụ đề trên TV rồi vào dịch luôn.', phone: 'connect.png' },
];
const card = p => `<section class="card"><div class="cap"><h1>${p.title}</h1><p>${p.text}</p></div><div class="phone"><img src="../appstore/raw/${p.phone}" alt=""></div></section>`;
const id = new URLSearchParams(location.search).get('post');
const root = document.getElementById('root');
if (id) { document.body.style.background = '#000'; root.innerHTML = card(POSTS.find(p => p.id === id)); }
else { root.className = 'grid'; root.innerHTML = POSTS.map(p => `<div class="wrap">${card(p)}</div>`).join(''); }
</script>
</body>
</html>
